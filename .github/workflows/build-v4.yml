name: Build Butz Konfigurator V4

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: V4 ZIP finden
        shell: bash
        run: |
          set -e

          ZIP_FILE="$GITHUB_WORKSPACE/Butz-Konfigurator-Android-V4-LOGIN-ROUTING-FIX.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "FEHLER: V4 ZIP nicht gefunden."
            echo ""
            echo "ZIP-Dateien im Repository:"
            find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          echo "ZIP gefunden:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: V4 ZIP entpacken
        shell: bash
        run: |
          set -e

          EXTRACT_DIR="$GITHUB_WORKSPACE/v4-build"

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          echo "ZIP entpackt."

          SETTINGS_FILE="$(find "$EXTRACT_DIR" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "FEHLER: settings.gradle wurde in der ZIP nicht gefunden."
            find "$EXTRACT_DIR" -maxdepth 4 -type f -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "FEHLER: app/build.gradle fehlt."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/build.gradle" ]; then
            echo "FEHLER: Root build.gradle fehlt."
            exit 1
          fi

          echo "Android-Projekt gefunden:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v4

      - name: Android SDK Pakete installieren
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;34.0.0"

      - name: Gradle 8.9 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Projekt prüfen
        shell: bash
        run: |
          echo "Projektordner:"
          echo "$PROJECT_DIR"
          echo ""

          echo "build.gradle:"
          cat "$PROJECT_DIR/build.gradle"

          echo ""
          echo "app/build.gradle:"
          cat "$PROJECT_DIR/app/build.gradle"

          echo ""
          echo "Wichtige Dateien:"

          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/java/de/butzliftparts/konfigurator/MainActivity.java"
          test -f "$PROJECT_DIR/app/src/main/assets/web/index.html"
          test -f "$PROJECT_DIR/app/src/main/assets/web/app/index.html"

          echo "Projektprüfung erfolgreich."

      - name: APK bauen
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: APK finden
        shell: bash
        run: |
          set -e

          APK_FILE="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f \
            -name "*.apk" \
            -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "FEHLER: Keine APK gefunden."
            find "$PROJECT_DIR/app/build/outputs" -type f -print || true
            exit 1
          fi

          echo "APK gefunden:"
          echo "$APK_FILE"

          cp "$APK_FILE" "$GITHUB_WORKSPACE/Butz-Konfigurator-V4.apk"

          ls -lh "$GITHUB_WORKSPACE/Butz-Konfigurator-V4.apk"

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Butz-Konfigurator-V4-APK
          path: Butz-Konfigurator-V4.apk
          if-no-files-found: error
          retention-days: 30
