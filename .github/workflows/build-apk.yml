name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v4

      - name: Android Pakete installieren
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;34.0.0"

      - name: Gradle 8.9 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Android Projekt aus Dateien erstellen
        shell: bash
        run: |
          set -e

          ROOT="$GITHUB_WORKSPACE"
          PROJECT="$GITHUB_WORKSPACE/android-build"

          echo "Erstelle sauberes Android Projekt..."

          rm -rf "$PROJECT"

          mkdir -p "$PROJECT/app/src/main/java/de/butzliftparts/konfigurator"
          mkdir -p "$PROJECT/app/src/main/res/values"
          mkdir -p "$PROJECT/app/src/main/assets/web/app"
          mkdir -p "$PROJECT/app/src/main/assets/web/admin"
          mkdir -p "$PROJECT/app/src/main/assets/web/assets/models"
          mkdir -p "$PROJECT/app/src/main/assets/web/assets/brand"
          mkdir -p "$PROJECT/app/src/main/assets/web/assets/homescreen"

          echo "Erstelle settings.gradle..."

          cat > "$PROJECT/settings.gradle" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'ButzKonfigurator'
          include ':app'
          EOF

          echo "Erstelle Root build.gradle..."

          cat > "$PROJECT/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          echo "Erstelle gradle.properties..."

          cat > "$PROJECT/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          echo "Erstelle app/build.gradle..."

          cat > "$PROJECT/app/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'de.butzliftparts.konfigurator'
              compileSdk 35

              defaultConfig {
                  applicationId 'de.butzliftparts.konfigurator'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '1.0.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          if [ ! -f "$ROOT/AndroidManifest.xml" ]; then
              echo "FEHLER: AndroidManifest.xml fehlt."
              exit 1
          fi

          cp "$ROOT/AndroidManifest.xml" \
             "$PROJECT/app/src/main/AndroidManifest.xml"

          if [ ! -f "$ROOT/MainActivity.java" ]; then
              echo "FEHLER: MainActivity.java fehlt."
              exit 1
          fi

          cp "$ROOT/MainActivity.java" \
             "$PROJECT/app/src/main/java/de/butzliftparts/konfigurator/MainActivity.java"

          cat > "$PROJECT/app/src/main/res/values/styles.xml" <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:colorAccent">#2F6F9F</item>
                  <item name="android:navigationBarColor">#F8FAFC</item>
                  <item name="android:statusBarColor">#1D3557</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          echo "Suche Startseite..."

          HOME_HTML="$(find "$ROOT" -maxdepth 1 -type f -name 'index*.html' \
            -exec grep -l 'Startseite für den Butz-Liftparts Tableau-Konfigurator' {} \; \
            | head -n 1)"

          echo "Suche Konfigurator..."

          APP_HTML="$(find "$ROOT" -maxdepth 1 -type f -name 'index*.html' \
            -exec grep -l 'bl_config_auth_v1' {} \; \
            | head -n 1)"

          echo "Suche Mitarbeiterbereich..."

          ADMIN_HTML="$(find "$ROOT" -maxdepth 1 -type f -name 'index*.html' \
            -exec grep -l 'Butz-Liftparts Mitarbeiterbereich' {} \; \
            | head -n 1)"

          if [ -z "$HOME_HTML" ]; then
              echo "FEHLER: Startseiten-index.html nicht gefunden."
              exit 1
          fi

          if [ -z "$APP_HTML" ]; then
              echo "FEHLER: Konfigurator-index.html nicht gefunden."
              exit 1
          fi

          if [ -z "$ADMIN_HTML" ]; then
              echo "FEHLER: Admin-index.html nicht gefunden."
              exit 1
          fi

          echo "Startseite: $HOME_HTML"
          echo "Konfigurator: $APP_HTML"
          echo "Admin: $ADMIN_HTML"

          cp "$HOME_HTML" \
             "$PROJECT/app/src/main/assets/web/index.html"

          cp "$APP_HTML" \
             "$PROJECT/app/src/main/assets/web/app/index.html"

          cp "$ADMIN_HTML" \
             "$PROJECT/app/src/main/assets/web/admin/index.html"

          echo "Kopiere Javascript und CSS..."

          find "$ROOT" -maxdepth 1 -type f \
            \( -name '*.js' -o -name '*.css' \) \
            -exec cp {} "$PROJECT/app/src/main/assets/web/assets/" \;

          echo "Kopiere 3D Modelle..."

          find "$ROOT" -maxdepth 1 -type f -name '*.json' \
            -exec cp {} "$PROJECT/app/src/main/assets/web/assets/models/" \;

          if [ -f "$ROOT/butz-liftparts-logo.png" ]; then
              cp "$ROOT/butz-liftparts-logo.png" \
                 "$PROJECT/app/src/main/assets/web/assets/brand/butz-liftparts-logo.png"
          fi

          if [ -f "$ROOT/technische-blaupause-aufzug.png" ]; then
              cp "$ROOT/technische-blaupause-aufzug.png" \
                 "$PROJECT/app/src/main/assets/web/assets/homescreen/technische-blaupause-aufzug.png"
          fi

          if [ -f "$ROOT/SUPABASE_SETUP_CUSTOMER_REQUESTS.sql" ]; then
              cp "$ROOT/SUPABASE_SETUP_CUSTOMER_REQUESTS.sql" \
                 "$PROJECT/app/src/main/assets/web/"
          fi

          echo "Launcher Icon vorbereiten..."

          ICON="$(find "$ROOT" -maxdepth 1 -type f -name 'ic_launcher*.png' | head -n 1)"

          if [ -n "$ICON" ]; then
              for DENSITY in mdpi hdpi xhdpi xxhdpi xxxhdpi
              do
                  mkdir -p "$PROJECT/app/src/main/res/mipmap-$DENSITY"
                  cp "$ICON" "$PROJECT/app/src/main/res/mipmap-$DENSITY/ic_launcher.png"
              done
          else
              echo "FEHLER: ic_launcher.png nicht gefunden."
              exit 1
          fi

          echo ""
          echo "Android Projekt erfolgreich rekonstruiert."
          echo ""

          find "$PROJECT" -maxdepth 5 -type f | head -100

      - name: APK bauen
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/android-build"
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: APK vorbereiten
        shell: bash
        run: |
          APK_PATH="$(find "$GITHUB_WORKSPACE/android-build/app/build/outputs" \
            -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK_PATH" ]; then
              echo "FEHLER: Keine APK gefunden."
              exit 1
          fi

          echo "APK gefunden:"
          echo "$APK_PATH"

          cp "$APK_PATH" "$GITHUB_WORKSPACE/Butz-Konfigurator.apk"

          ls -lh "$GITHUB_WORKSPACE/Butz-Konfigurator.apk"

      - name: APK als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Butz-Konfigurator-APK
          path: Butz-Konfigurator.apk
          if-no-files-found: error
          retention-days: 30
